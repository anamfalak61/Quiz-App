<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">

    <section id="start-screen" class="screen">
      <h1>Quiz App</h1>
      <p class="muted">Pick a category. You get 15 seconds per question.</p>
      <div id="category-list" class="category-list" role="group" aria-label="Quiz category"></div>
    </section>

    <section id="quiz-screen" class="screen" hidden>
      <header class="quiz-header">
        <p id="progress-text" class="muted">Question 1 of 5</p>
        <p class="timer" aria-live="off"><span id="time-left">15</span>s</p>
      </header>
      <div class="bar"><div id="progress-bar" class="bar-fill"></div></div>
      <div class="bar bar-timer"><div id="timer-bar" class="bar-fill"></div></div>
      <h2 id="question-text"></h2>
      <div id="options" class="options" role="radiogroup" aria-labelledby="question-text"></div>
      <button id="next-btn" class="btn" disabled>Next</button>
    </section>

    <section id="result-screen" class="screen" hidden>
      <h1>Quiz complete</h1>
      <p id="score-text" class="score"></p>
      <p id="feedback-text" class="muted"></p>
      <ul id="review-list" class="review"></ul>
      <button id="restart-btn" class="btn">Retake quiz</button>
    </section>

  </main>
  <script src="js/questions.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
